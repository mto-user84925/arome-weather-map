name: Archivage Automatique des Cartes AROME

on:
  # 1. Déclenchement automatique dès que le pipeline météo a terminé avec succès
  workflow_run:
    workflows:
      - "Mise a Jour Automatique Multi-Modeles Meteo (24/7)"
    types:
      - completed

  # 2. Cron de secours : 00Z (05h00 UTC) et 12Z (17h00 UTC)

  # 3. Déclenchement manuel pour tests
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  archive-maps:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation Pillow
        run: pip install pillow

      - name: Restaurer output/arome depuis le dernier artefact Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/base /tmp/base/restored
          for RUN_ID in $(gh run list --repo ${{ github.repository }} \
                --status success --limit 10 --json databaseId,workflowName --jq \
                '.[] | select(.workflowName | test("Multi-Modeles|Pages|AROME")) | .databaseId' 2>/dev/null || true); do
            if gh run download "$RUN_ID" --repo ${{ github.repository }} \
                 -n github-pages -D /tmp/base >/dev/null 2>&1; then
              tar -xf /tmp/base/artifact.tar -C /tmp/base/restored
              mkdir -p output
              cp -r /tmp/base/restored/output/arome output/ 2>/dev/null || true
              rm -rf /tmp/base
              echo "output/arome restaure depuis le run $RUN_ID"
              break
            fi
          done

      - name: Verification du run courant (00Z ou 12Z uniquement)
        id: check_run
        run: |
          RUN_HOUR=$(python3 -c "import json, os, sys; d=json.load(open('output/arome/maps/index.json')) if os.path.exists('output/arome/maps/index.json') else {}; print(int(d.get('run_time','')[11:13]) if len(d.get('run_time',''))>=13 else -1)" 2>/dev/null || echo -1)
          echo "Run hour: $RUN_HOUR"
          if [ "$RUN_HOUR" = "0" ] || [ "$RUN_HOUR" = "12" ]; then
            echo "is_major_run=true" >> $GITHUB_OUTPUT
          else
            echo "is_major_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Generation de l'archive Photos d'antenne (France + Hauts-de-France)
        if: steps.check_run.outputs.is_major_run == 'true'
        id: package
        run: |
          echo "MONTH_TAG=archives-$(date -u +'%Y-%m')" >> $GITHUB_ENV
          python pipeline/package_archive.py

      - name: Publication dans GitHub Releases
        if: steps.check_run.outputs.is_major_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Creer la release mensuelle si elle n'existe pas
          if ! gh release view "${MONTH_TAG}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Creation de la release mensuelle ${MONTH_TAG}..."
            gh release create "${MONTH_TAG}" \
              --repo "${{ github.repository }}" \
              --title "Archives Cartes AROME — $(date -u +'%B %Y')" \
              --notes "Archives officielles des runs 00Z et 12Z (France Entière + Hauts-de-France)."
          fi

          # 2. Uploader le zip genere
          for z in arome_*.zip; do
            if [ -f "$z" ]; then
              echo "Upload de $z dans ${MONTH_TAG}..."
              gh release upload "${MONTH_TAG}" "$z" --repo "${{ github.repository }}" --clobber
              echo "Archive $z publiee avec succes !"
            fi
          done

      - name: Info si run non-majeur ignore
        if: steps.check_run.outputs.is_major_run != 'true'
        run: |
          echo "Run actuel non-00Z/12Z — archivage ignore pour ce cycle."

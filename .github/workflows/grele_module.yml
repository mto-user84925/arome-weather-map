# =============================================================================
# Module Grêle & Convectif (AROME 0,025°) — automatisation dédiée
# =============================================================================
# SÉPARÉE de l'automatisation AROME habituelle (1,3 km, cartes de base).
# Produit UNIQUEMENT les couches du module convectif :
#   - 6 couches : ipo, ipg, ipt, instabilite, orages_simules, rafales_convectives
#   - synthèses 24h J0 / J+1 ({couche}_24h_{j0|j1}.webp)
#   - fichiers communaux MCV2 (output/arome/maps/communes/{dep}.bin.gz)
#
# PAS de cron : le déclenchement est assuré par le programme externe
# (workflow_dispatch via l'API GitHub), après chaque run AROME
# (00z, 03z, 06z, 09z, 12z, 15z, 18z, 21z).
# =============================================================================

name: Module Grele & Convectif (AROME 0,025°)

on:
  workflow_dispatch:
    inputs:
      max_hours:
        description: 'Échéance max (0-51, défaut 51)'
        required: false
        default: '51'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "grele-module"
  cancel-in-progress: false

jobs:
  grele-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      AROME_OUT_DIR: ${{ github.workspace }}/output

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dépendances système + Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --fix-missing libeccodes0 libeccodes-tools
          python -m pip install --upgrade pip
          pip install numpy pillow requests eccodes scipy

      - name: Restaurer les donnees des autres modules avant ajout convectif
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/base /tmp/base/restored
          RESTORED=""
          for RUN_ID in $(gh run list --repo ${{ github.repository }} \
                --status success --limit 10 --json databaseId,workflowName --jq \
                '.[] | select(.workflowName | test("Multi-Modeles|Pages|AROME")) | .databaseId' 2>/dev/null || true); do
            if gh run download "$RUN_ID" --repo ${{ github.repository }} \
                 -n github-pages -D /tmp/base >/dev/null 2>&1; then
              RESTORED="$RUN_ID"
              break
            fi
          done
          if [ -n "$RESTORED" ]; then
            tar -xf /tmp/base/artifact.tar -C /tmp/base/restored
            cp -r /tmp/base/restored/output ./ 2>/dev/null || true
            rm -rf /tmp/base
            echo "Base restauree depuis le run $RESTORED"
          fi

      - name: Pipeline Module Grêle (couches convectives 0,025°)
        run: |
          python -u pipeline/arome_open_data_remote.py \
            --convective-only \
            --max-hours "${{ inputs.max_hours || '51' }}"

      # ── Pas de commit des cartes dans Git (règle d'or n°1) ───────────────
      # L'ancienne étape faisait `git add -A output/arome/maps/` alors que
      # .gitignore exclut `output/` : la commande échouait en exit 1, et
      # `contents: write` permettait d'alourdir l'historique. Publication
      # uniquement via l'artefact Pages ci-dessous.
      - name: Préparation du site
        run: |
          mkdir -p _site
          # Les assets partagés (fond, frontières, communes, masque) viennent
          # de assets/maps : sans eux, le rendu convectif serait sans fond.
          if [ -d assets/maps ]; then cp -r assets/maps/* output/arome/maps/ 2>/dev/null || true; fi
          cp *.html _site/ 2>/dev/null || true
          cp logo*.png _site/ 2>/dev/null || true
          touch _site/.nojekyll
          cp -r js _site/ 2>/dev/null || true
          cp -r css _site/ 2>/dev/null || true
          cp -r vigilance-assets _site/ 2>/dev/null || true
          # Fusionne : output/ contient les couches du module ET l'index.json
          # précédent (restauré via GH_TOKEN dans deploy-pages.yml).
          mv output _site/ 2>/dev/null || true

      - name: Configuration Pages
        uses: actions/configure-pages@v5

      - name: Téléversement de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


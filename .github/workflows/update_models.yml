name: "Mise a Jour Automatique Multi-Modeles Meteo (24/7)"

# Déclenchement UNIQUEMENT via l'API (outil externe) :
#   POST /repos/{owner}/{repo}/actions/workflows/update_models.yml/dispatches
#        {"ref":"main","inputs":{"max_hours":"51"}}
# Aucun cron GitHub : les runs sont pilotés par l'orchestrateur externe.
on:
  workflow_dispatch:
    inputs:
      max_hours:
        description: "Échéance maximale AROME (heures, 24 à 51)"
        required: false
        default: "51"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "weather-pipeline"
  cancel-in-progress: false

jobs:
  update-weather-models:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      METEOFRANCE_TOKEN: ${{ secrets.METEOFRANCE_TOKEN }}

    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dependances systeme et Python
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes-tools
          python -m pip install --upgrade pip
          pip install numpy pillow requests eccodes cfgrib xarray scipy ecmwf-opendata shapely

      - name: Verification du token AROME
        run: |
          if [ -z "$METEOFRANCE_TOKEN" ]; then
            echo "WARNING: METEOFRANCE_TOKEN non configure — AROME sera saute"
          else
            echo "Token AROME present (${#METEOFRANCE_TOKEN} caracteres)"
          fi

      - name: Execution du Pipeline Multi-Modeles
        run: |
          # AROME via open data (GRIB2 data.gouv.fr, gratuit).
          # -u = sortie non bufferisée (progression visible en temps réel dans les logs)
          python -u pipeline/arome_open_data.py
        env:
          # Consommé par le pipeline via l'input ; garde une valeur par
          # défaut si l'orchestrateur n'en fournit pas.
          MAX_HOURS: ${{ inputs.max_hours || '51' }}

      # ── Restauration des autres modules AVANT de reconstruire _site ────
      # update_models ne genere que output/arome/. Sans cette etape, son
      # output/ ne contient qu'un dossier, et `cp -r output _site/` ECRASE
      # les cartes des autres modules (arome_antilles, arome_reunion)
      # publiees par arome_om.yml. Constate en production : les Outre-Mer
      # repassaient en 404 quelques minutes apres chaque run AROME.
      # On repart du dernier artefact Pages reussi (qui contient TOUS les
      # modules), puis le pipeline AROME ecrase proprement output/arome/.
      - name: Restaurer les donnees des autres modules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/base /tmp/base/restored
          RESTORED=""
          for RUN_ID in $(gh run list --repo ${{ github.repository }} \
                --status success --limit 10 --json databaseId,workflowName --jq \
                '.[] | select(.workflowName | test("Multi-Modeles|Pages|AROME")) | .databaseId' 2>/dev/null || true); do
            echo "Tentative de restauration depuis le run $RUN_ID..."
            if gh run download "$RUN_ID" --repo ${{ github.repository }} \
                 -n github-pages -D /tmp/base >/dev/null 2>&1; then
              RESTORED="$RUN_ID"
              break
            fi
          done
          if [ -n "$RESTORED" ]; then
            tar -xf /tmp/base/artifact.tar -C /tmp/base/restored
            # Copie module par module, SANS toucher a output/arome
            # (regenere par le pipeline juste avant).
            for d in /tmp/base/restored/output/*/; do
              name=$(basename "$d")
              [ "$name" = "arome" ] && continue
              mkdir -p "output/$name"
              cp -r "$d"* "output/$name/" 2>/dev/null || true
            done
            rm -rf /tmp/base
            echo "Base restauree depuis le run $RESTORED"
            echo "Modules presents : $(ls output 2>/dev/null | tr '\n' ' ')"
          else
            echo "Attention : aucun artefact precedent trouve"
          fi

      # ── Déploiement GitHub Pages direct (sans commit git des ~750 Mo de cartes) ──
      - name: Preparation du site
        run: |
          git fetch origin main && git checkout origin/main -- index.html previsions.html grele.html alerte-grele.html vigilance.html js/ css/ 2>/dev/null || true
          mkdir -p _site
          mkdir -p output/arome/maps
          cp -r assets/maps/* output/arome/maps/ 2>/dev/null || true
          cp index.html _site/ 2>/dev/null || true
          cp previsions.html _site/ 2>/dev/null || true
          cp grele.html _site/ 2>/dev/null || true
          cp *.html _site/ 2>/dev/null || true
          cp logo*.png _site/ 2>/dev/null || true
          touch _site/.nojekyll
          cp -r js _site/ 2>/dev/null || true
          cp -r css _site/ 2>/dev/null || true
          cp -r vigilance-assets _site/ 2>/dev/null || true
          mv output _site/ 2>/dev/null || true

      - name: Configuration Pages
        uses: actions/configure-pages@v5

      - name: Televersement de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

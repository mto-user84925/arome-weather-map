name: "Mise a Jour Automatique Multi-Modeles Meteo (24/7)"

on:
  schedule:
    - cron: '15 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "weather-pipeline"
  cancel-in-progress: false

jobs:
  update-weather-models:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      METEOFRANCE_TOKEN: ${{ secrets.METEOFRANCE_TOKEN }}

    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dependances systeme et Python
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes-tools
          python -m pip install --upgrade pip
          pip install numpy pillow requests eccodes cfgrib xarray scipy ecmwf-opendata shapely

      - name: Verification du token AROME
        run: |
          if [ -z "$METEOFRANCE_TOKEN" ]; then
            echo "WARNING: METEOFRANCE_TOKEN non configure — AROME sera saute"
          else
            echo "Token AROME present (${#METEOFRANCE_TOKEN} caracteres)"
          fi

      - name: Execution du Pipeline Multi-Modeles
        run: |
          # AROME via open data (GRIB2 data.gouv.fr, gratuit).
          # -u = sortie non bufferisée (progression visible en temps réel dans les logs)
          python -u pipeline/arome_open_data.py

      # ── Déploiement GitHub Pages direct (sans commit git des ~750 Mo de cartes) ──
      - name: Preparation du site
        run: |
          mkdir -p _site
          mkdir -p output/arome/maps
          cp -r assets/maps/* output/arome/maps/ 2>/dev/null || true
          cp index.html _site/ 2>/dev/null || true
          cp previsions.html _site/ 2>/dev/null || true
          cp grele.html _site/ 2>/dev/null || true
          cp *.html _site/ 2>/dev/null || true
          cp logo*.png _site/ 2>/dev/null || true
          touch _site/.nojekyll
          cp -r js _site/ 2>/dev/null || true
          cp -r css _site/ 2>/dev/null || true
          cp -r vigilance-assets _site/ 2>/dev/null || true
          cp -r output _site/ 2>/dev/null || true

      - name: Configuration Pages
        uses: actions/configure-pages@v5

      - name: Televersement de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

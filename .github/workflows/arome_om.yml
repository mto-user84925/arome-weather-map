name: "Generation AROME Outre-Mer (Antilles & Reunion)"

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domaine a generer (all, antilles, reunion)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - antilles
          - reunion
      max_hours:
        description: 'Echeance max (heures, ex: 48)'
        required: true
        default: '48'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "arome-om-pipeline"
  cancel-in-progress: false

jobs:
  render-om:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes-tools
          python -m pip install --upgrade pip
          pip install numpy pillow requests eccodes cfgrib xarray scipy shapely

      - name: Generation des fonds de carte Outre-Mer
        run: |
          python pipeline/generate_fond_arome.py --domain ${{ github.event.inputs.domain || 'all' }}

      - name: Rendu des paquets meteo AROME-OM (S3 PNT OVH)
        run: |
          python -u pipeline/arome_om.py --domain ${{ github.event.inputs.domain || 'all' }} --max-hours ${{ github.event.inputs.max_hours || '48' }}

      # ── Pas de commit des cartes dans Git (règle d'or n°1) ───────────────
      # L'ancienne étape « Commit et Push des cartes Outre-Mer » faisait
      # `git add output/...` alors que .gitignore exclut `output/` :
      #   fatal: The following paths are ignored by one of your .gitignore files
      #   ##[error]Process completed with exit code 1
      # L'étape échouait donc à CHAQUE run, après ~18 min de rendu perdu, et
      # `contents: write` permettait en plus d'écrire dans l'historique.
      # Les dalles sont désormais publiées uniquement via l'artefact Pages.

      # ── Restauration des autres modules AVANT de reconstruire _site ────
      # Ce workflow ne genere que output/arome_antilles et output/arome_reunion.
      # Sans cette etape, `cp -r output _site/` publie un artefact SANS
      # output/arome/ : les cartes AROME HD disparaissent du site (404 sur
      # index.json et sur toutes les dalles), jusqu'au prochain run AROME.
      # On repart du dernier artefact Pages reussi (tous modules confondus)
      # et on n'ecrase que les dossiers regeneres ici.
      - name: Restaurer les donnees des autres modules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/base /tmp/base/restored
          RESTORED=""
          for RUN_ID in $(gh run list --repo ${{ github.repository }} \
                --status success --limit 10 --json databaseId,workflowName --jq \
                '.[] | select(.workflowName | test("Multi-Modeles|Pages|AROME")) | .databaseId' 2>/dev/null || true); do
            echo "Tentative de restauration depuis le run $RUN_ID..."
            if gh run download "$RUN_ID" --repo ${{ github.repository }} \
                 -n github-pages -D /tmp/base >/dev/null 2>&1; then
              RESTORED="$RUN_ID"
              break
            fi
          done
          if [ -n "$RESTORED" ]; then
            tar -xf /tmp/base/artifact.tar -C /tmp/base/restored
            for d in /tmp/base/restored/output/*/; do
              name=$(basename "$d")
              case "$name" in
                arome_antilles|arome_reunion) continue ;;  # regeneres ci-dessus
              esac
              mkdir -p "output/$name"
              cp -r "$d"* "output/$name/" 2>/dev/null || true
            done
            echo "Base restauree depuis le run $RESTORED"
            echo "Modules presents : $(ls output 2>/dev/null | tr '\n' ' ')"
          else
            echo "Attention : aucun artefact precedent trouve"
          fi

      - name: Préparation du site
        run: |
          mkdir -p _site
          mkdir -p output/arome/maps
          # Assets géographiques statiques (fond, frontières, communes, masque)
          if [ -d assets/maps ]; then cp -r assets/maps/* output/arome/maps/ 2>/dev/null || true; fi
          cp index.html _site/ 2>/dev/null || true
          cp previsions.html _site/ 2>/dev/null || true
          cp grele.html _site/ 2>/dev/null || true
          cp *.html _site/ 2>/dev/null || true
          cp logo*.png _site/ 2>/dev/null || true
          touch _site/.nojekyll
          cp -r js _site/ 2>/dev/null || true
          cp -r css _site/ 2>/dev/null || true
          cp -r vigilance-assets _site/ 2>/dev/null || true
          cp -r output _site/ 2>/dev/null || true
          echo "Contenu publié :"
          du -sh _site/output/arome_antilles _site/output/arome_reunion 2>/dev/null || true

      - name: Configuration Pages
        uses: actions/configure-pages@v5

      - name: Televersement de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
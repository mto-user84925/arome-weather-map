name: "Generation AROME Outre-Mer (Antilles & Reunion)"

on:
  schedule:
    # Runs AROME-OM calés sur 00Z, 06Z, 12Z, 18Z (décalage de 4h pour disponibilité S3 OVH)
    - cron: '15 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domaine a generer (all, antilles, reunion)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - antilles
          - reunion
      max_hours:
        description: 'Echeance max (heures, ex: 48)'
        required: true
        default: '48'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "arome-om-pipeline"
  cancel-in-progress: false

jobs:
  render-om:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4

      - name: Configuration de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev libeccodes-tools
          python -m pip install --upgrade pip
          pip install numpy pillow requests eccodes cfgrib xarray scipy shapely

      - name: Generation des fonds de carte Outre-Mer
        run: |
          python pipeline/generate_fond_arome.py --domain ${{ github.event.inputs.domain || 'all' }}

      - name: Rendu des paquets meteo AROME-OM (S3 PNT OVH)
        run: |
          python -u pipeline/arome_om.py --domain ${{ github.event.inputs.domain || 'all' }} --max-hours ${{ github.event.inputs.max_hours || '48' }}

      - name: Commit et Push des cartes Outre-Mer
        run: |
          git config --global user.name "Meteo Automations Bot"
          git config --global user.email "bot@meteo-climat.pro"
          git add output/arome_antilles/ output/arome_reunion/
          if git diff --staged --quiet; then
            echo "Aucune nouvelle carte Outre-Mer a pousser."
          else
            git commit -m "Mise a jour AROME-OM Antilles/Reunion [$(date -u +'%Y-%m-%d %H:%MZ')]"
            for i in 1 2 3; do
              git fetch origin main
              git merge origin/main -X ours --no-edit || {
                git checkout --ours -- output/ 2>/dev/null || true
                git add output/
                git commit -m "Merge remote changes" --no-edit || true
              }
              if git push origin main; then
                echo "Push reussi."
                break
              fi
              echo "Tentative $i echouee, retry dans 5s..."
              sleep 5
            done
          fi

      - name: Preparation du site
        run: |
          mkdir -p _site
          cp index.html _site/ 2>/dev/null || true
          cp previsions.html _site/ 2>/dev/null || true
          cp grele.html _site/ 2>/dev/null || true
          cp *.html _site/ 2>/dev/null || true
          cp logo.png _site/ 2>/dev/null || true
          cp -r js _site/ 2>/dev/null || true
          cp -r css _site/ 2>/dev/null || true
          cp -r output _site/ 2>/dev/null || true

      - name: Configuration Pages
        uses: actions/configure-pages@v5

      - name: Televersement de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4